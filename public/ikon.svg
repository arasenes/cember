<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="cemberBotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="cemberEarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
  </defs>
  <style>
    @keyframes combiFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-3.5px); }
    }
    @keyframes combiBlink {
      0%, 92%, 100% { transform: scaleY(1); }
      95% { transform: scaleY(0.12); }
    }
    @keyframes combiMicPulse {
      0%, 100% { filter: drop-shadow(0 0 2px #38BDF8); opacity: 0.85; }
      50% { filter: drop-shadow(0 0 6px #38BDF8); opacity: 1; }
    }
    @keyframes combiSatellitePulse {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 2px rgba(245, 158, 11, 0.5)); }
      50% { transform: scale(1.18); filter: drop-shadow(0 0 8px rgba(245, 158, 11, 0.95)); }
    }
    .combi-float {
      animation: combiFloat 3s ease-in-out infinite;
      transform-origin: 50% 50%;
    }
    .combi-eye-l {
      animation: combiBlink 4s ease-in-out infinite;
      transform-origin: 40px 50px;
    }
    .combi-eye-r {
      animation: combiBlink 4s ease-in-out infinite;
      transform-origin: 60px 50px;
    }
    .combi-mic {
      animation: combiMicPulse 1.8s ease-in-out infinite;
    }
    .combi-satellite {
      animation: combiSatellitePulse 2.4s ease-in-out infinite;
      transform-origin: 50px 85px;
    }
  </style>

  <rect width="100" height="100" rx="24" fill="#0D1322" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />

  <g class="combi-float">
    <path d="M 24 46 C 24 24, 76 24, 76 46" stroke="url(#cemberBotGrad)" stroke-width="5.5" stroke-linecap="round" fill="none" />
    <rect x="17" y="41" width="9.5" height="21" rx="4.5" fill="url(#cemberEarGrad)" />
    <rect x="73.5" y="41" width="9.5" height="21" rx="4.5" fill="url(#cemberEarGrad)" />
    <rect x="25" y="32" width="50" height="42" rx="18" fill="#182033" stroke="url(#cemberBotGrad)" stroke-width="3.8" />
    <ellipse class="combi-eye-l" cx="40" cy="50" rx="4.5" ry="6.5" fill="#38BDF8" />
    <ellipse class="combi-eye-r" cx="60" cy="50" rx="4.5" ry="6.5" fill="#38BDF8" />
    <path d="M 73 56 C 73 68, 62 74, 52 74" stroke="url(#cemberBotGrad)" stroke-width="3.5" stroke-linecap="round" fill="none" />
    <circle class="combi-mic" cx="50" cy="74" r="3.2" fill="#38BDF8" />
  </g>

  <circle class="combi-satellite" cx="50" cy="85" r="3.8" fill="url(#cemberBotGrad)" />
</svg>
